<section
  class="board-section"
  [attr.aria-label]="lang.t('Moodboard de la colección', 'Collection moodboard')"
>
  <figure class="board-frame">
    <img
      src="/assets/moodboard/moodboard.jpg"
      [alt]="
        lang.t(
          'Moodboard de la colección Lobotomy Chic',
          'Moodboard for the Lobotomy Chic collection'
        )
      "
      mrImageFallback="/assets/placeholders/look-placeholder.svg"
      loading="lazy"
      decoding="async"
    />
  </figure>
</section>
