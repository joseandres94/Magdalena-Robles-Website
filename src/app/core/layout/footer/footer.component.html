<footer class="mr-footer" role="contentinfo">
  <img
    class="footer-sponsor"
    src="assets/logos/logo_junta_andalucia.png"
    alt="Junta de Andalucía. Consejería de Inclusión Social, Juventud, Familias e Igualdad. Instituto Andaluz de la Juventud"
    width="700"
    height="97"
    loading="lazy"
  />
  <div class="footer-inner">
    <span class="footer-logo" aria-label="Magdalena Robles">Magdalena Robles</span>

    <div class="footer-right">
      <div class="footer-socials">
        <a routerLink="/contact">{{ lang.t('Contacto', 'Contact') }}</a>
        <a routerLink="/privacy">{{ lang.t('Privacidad', 'Privacy') }}</a>
        @for (s of brand.socials; track s.platform) {
          <a [href]="s.url" target="_blank" rel="noopener noreferrer">{{ s.label }}</a>
        }
      </div>
      <span class="footer-text">© {{ year }} — {{ brand.location }}</span>
    </div>
  </div>
</footer>
