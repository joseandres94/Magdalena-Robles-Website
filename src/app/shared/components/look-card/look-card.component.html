<article class="look-card">
  <!-- Image area -->
  <button
    type="button"
    class="look-trigger"
    (click)="cardClick.emit(look)"
    [attr.aria-label]="
      lang.t('Vista rápida: ', 'Quick view: ') + 'Look ' + look.number + ' — ' + look.name
    "
  >
    <span class="look-img" [style.background]="look.bgColor">
      @if (look.images[0]; as hero) {
        <img
          class="look-photo"
          [src]="hero.src"
          [alt]="hero.alt"
          mrImageFallback="/assets/placeholders/look-placeholder.svg"
          loading="lazy"
          decoding="async"
        />
      }
      <span class="look-overlay" aria-hidden="true"></span>
      <span class="look-roman" aria-hidden="true">{{ look.roman }}</span>
    </span>
  </button>

  <!-- Meta -->
  <footer class="look-meta">
    <span class="look-num">{{ look.number | lookNumber }}</span>
    <a [routerLink]="['/collection', look.slug]" class="look-detail-link">
      <h3 class="look-name">{{ look.name }}</h3>
      <p class="look-desc">{{ lang.isEs() ? look.shortDescription : look.shortDescriptionEn }}</p>
      <span class="look-more">{{ lang.t('Ver ficha', 'View story') }} →</span>
    </a>
  </footer>
</article>
